[project]
name = "tpp-analytics"
version = "0.0.0"
description = "Read-only analytics boundary for the Tesla Personal Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-cloud-bigquery>=3.30,<4",
  "sqlglot==30.17.0",
  "tpp-shared-models",
  "tpp-tesla-client",
]

[tool.uv.sources]
tpp-shared-models = { workspace = true }
tpp-tesla-client = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tesla_personal_platform"]
