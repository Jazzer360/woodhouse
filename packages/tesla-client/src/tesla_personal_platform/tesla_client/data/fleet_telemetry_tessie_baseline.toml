# Tessie Fleet Telemetry field baseline supplied by the operator on 2026-08-23.
#
# Only field cadence/delta settings are retained. The source response's hostname,
# CA certificate, JWS issuer/audience/signature, sync state, and timestamps are
# deliberately excluded. This baseline is reference data, not a deployable
# transport configuration.
#
# Keep changes to this file limited to correcting transcription of that snapshot.
# Woodhouse policy belongs in fleet_telemetry_woodhouse.toml.

[baseline]
name = "tessie-operator-snapshot-2026-08-23"
delivery_policy = "latest"
alert_types = ["service", "customer", "service-fix"]

