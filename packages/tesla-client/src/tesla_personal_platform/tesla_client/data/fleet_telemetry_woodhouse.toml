# Woodhouse Fleet Telemetry policy layered over the operator-supplied Tessie baseline.
#
# This file is intentionally declarative and reviewable. A field must be in exactly
# one applicable state: inherited from Tessie, overridden here, added here, removed
# from Tessie, or explicitly omitted from the Tesla catalog.
#
# Cost target: keep total application usage within Tesla's $10 monthly developer
# discount with margin for commands, wakes, and live reads. Tesla pricing is runtime
# policy, not a vehicle-config field; re-audit it before changing cadence.
#
# minimum_delta is opt-in. Add it only when a physical/noisy/monotonic measurement
# has a defensible threshold. Discrete numeric levels and counts rely on Tesla's
# normal changed-value behavior.

[profile]
version = "broad-v1"
schema_version = "fleet-telemetry-v0.9.4-2026-08-23"
baseline = "tessie-operator-snapshot-2026-08-23"
delivery_policy = "latest"
alert_types = ["service", "customer", "service-fix"]

# Changes to Tessie fields. Every deviation carries its review rationale.
[overrides]
"GpsHeading" = { interval_seconds = 10, minimum_delta = 5, rationale = "Align heading with trip cadence while ignoring small directional jitter." }
"HvacLeftTemperatureRequest" = { interval_seconds = 5, rationale = "A setpoint is discrete in practice; five-second latency is enough and needs no numeric delta." }
"Location" = { interval_seconds = 10, minimum_delta = 10, rationale = "Tesla's own economical example uses 10 seconds; 10 meters filters GPS drift while preserving trip shape." }
"MediaNowPlayingAlbum" = { interval_seconds = 10, rationale = "Capture short tracks and skips for media history; unchanged metadata emits nothing." }
"MediaNowPlayingArtist" = { interval_seconds = 10, rationale = "Capture short tracks and skips for media history; unchanged metadata emits nothing." }
"MediaNowPlayingStation" = { interval_seconds = 10, rationale = "Capture station changes promptly; unchanged metadata emits nothing." }
"MediaNowPlayingTitle" = { interval_seconds = 10, rationale = "Capture short tracks and skips for media history; unchanged metadata emits nothing." }
"MediaPlaybackSource" = { interval_seconds = 10, rationale = "Capture source changes promptly; unchanged state emits nothing." }
"MediaPlaybackStatus" = { interval_seconds = 10, rationale = "Capture play/pause transitions promptly; unchanged state emits nothing." }
"Odometer" = { interval_seconds = 60, minimum_delta = 0.01, rationale = "Tessie's precision is retained but cadence is reduced to Tesla's economical example." }
"TpmsHardWarnings" = { interval_seconds = 60, rationale = "Warnings are rare changes, so lower latency adds negligible normal signal volume." }
"TpmsSoftWarnings" = { interval_seconds = 60, rationale = "Warnings are rare changes, so lower latency adds negligible normal signal volume." }
"VehicleSpeed" = { interval_seconds = 10, minimum_delta = 1, rationale = "Tesla's own economical example uses 10 seconds; one-mph delta suppresses small fluctuations." }

# New fields selected from Tesla's full documented catalog.
[additions]
"ACChargingEnergyIn" = { interval_seconds = 60, minimum_delta = 0.1, rationale = "Preserve metered AC session energy for charging-efficiency and cost analytics." }
"AutoSeatClimateLeft" = { interval_seconds = 5, rationale = "Capture comfort automation state changes, not continuous measurements." }
"AutoSeatClimateRight" = { interval_seconds = 5, rationale = "Capture comfort automation state changes, not continuous measurements." }
"BMSState" = { interval_seconds = 60, rationale = "Capture battery-management state transitions without high-rate engineering telemetry." }
"BrakePedal" = { interval_seconds = 5, rationale = "Mark braking state transitions without streaming pedal-position telemetry." }
"ChargePort" = { interval_seconds = 5, rationale = "Distinguish charge-port type/state changes in reconstructed charging sessions." }
"ChargePortColdWeatherMode" = { interval_seconds = 5, rationale = "Explain cold-weather charge-port behavior when it occurs." }
"ChargeRateMilePerHour" = { interval_seconds = 60, minimum_delta = 0.5, rationale = "Add a human-readable charging-rate trend at Tessie-like charging cadence." }
"ChargeState" = { interval_seconds = 5, rationale = "Provide a canonical low-latency charging-session state." }
"CruiseSetSpeed" = { interval_seconds = 10, minimum_delta = 1, rationale = "Support cruise-use analysis at driving cadence with one-mph changes." }
"DCChargingEnergyIn" = { interval_seconds = 60, minimum_delta = 0.1, rationale = "Preserve metered DC session energy for charging-efficiency and cost analytics." }
"DefrostForPreconditioning" = { interval_seconds = 5, rationale = "Explain defrost activity during preconditioning." }
"DriveRail" = { interval_seconds = 5, rationale = "Provide a low-cost vehicle-ready/driving state transition." }
"DriverSeatBelt" = { interval_seconds = 5, rationale = "Capture a safety state transition with little steady-state volume." }
"EstBatteryRange" = { interval_seconds = 60, minimum_delta = 0.1, rationale = "Match Tesla's own economical example and retain condition-aware range history." }
"EstimatedHoursToChargeTermination" = { interval_seconds = 60, minimum_delta = 0.0165, rationale = "Track charge completion estimates with approximately one-minute resolution." }
"GpsState" = { interval_seconds = 5, rationale = "Distinguish missing GPS lock from absent or stale location data." }
"GuestModeEnabled" = { interval_seconds = 5, rationale = "Retain rare guest-mode security state changes." }
"GuestModeMobileAccessState" = { interval_seconds = 5, rationale = "Explain guest-mode access state when enabled." }
"HvacACEnabled" = { interval_seconds = 5, rationale = "Distinguish compressor state in climate and efficiency analysis." }
"HvacAutoMode" = { interval_seconds = 5, rationale = "Distinguish automatic from manual HVAC behavior." }
"HvacFanSpeed" = { interval_seconds = 5, rationale = "Capture discrete fan-speed changes without an unnecessary numeric delta." }
"HvacRightTemperatureRequest" = { interval_seconds = 5, rationale = "Pair the right-side setpoint with Tessie's left-side setpoint." }
"LightsHazardsActive" = { interval_seconds = 5, rationale = "Capture rare hazard-light use without turn-signal volume." }
"LocatedAtFavorite" = { interval_seconds = 30, rationale = "Enable privacy-preserving place classification without custom geofence coordinates." }
"LocatedAtHome" = { interval_seconds = 30, rationale = "Enable privacy-preserving home classification without custom geofence coordinates." }
"LocatedAtWork" = { interval_seconds = 30, rationale = "Enable privacy-preserving work classification without custom geofence coordinates." }
"MilesSinceReset" = { interval_seconds = 30, minimum_delta = 1, rationale = "Provide the denominator for Tesla's authoritative HW4 self-driving statistic." }
"NotEnoughPowerToHeat" = { interval_seconds = 5, rationale = "Explain failed or constrained battery heating as a rare state transition." }
"OriginLocation" = { interval_seconds = 60, minimum_delta = 25, rationale = "Capture route origin once established while filtering GPS drift." }
"PairedPhoneKeyAndKeyFobQty" = { interval_seconds = 300, rationale = "Retain a low-frequency security inventory change." }
"PreconditioningEnabled" = { interval_seconds = 5, rationale = "Reconstruct preconditioning periods and their energy/climate context." }
"RearDefrostEnabled" = { interval_seconds = 5, rationale = "Capture a rare climate load relevant to cold-weather efficiency." }
"RouteTrafficMinutesDelay" = { interval_seconds = 60, minimum_delta = 1, rationale = "Retain coarse traffic-delay history for trip analysis." }
"ScheduledChargingPending" = { interval_seconds = 5, rationale = "Connect scheduled charging intent to actual sessions." }
"SeatVentEnabled" = { interval_seconds = 5, rationale = "Capture seat-ventilation state for comfort analysis." }
"ServiceMode" = { interval_seconds = 5, rationale = "Mark service-mode periods that affect other vehicle behavior." }
"SoftwareUpdateExpectedDurationMinutes" = { interval_seconds = 60, rationale = "Add useful update planning metadata without a redundant numeric delta." }
"WiperHeatEnabled" = { interval_seconds = 5, rationale = "Capture a rare cold-weather load." }

# Tessie fields intentionally removed by Woodhouse.
[removals]
"MediaAudioVolumeIncrement" = "Static UI increment metadata has no useful historical role."
"MediaAudioVolumeMax" = "Static UI maximum metadata has no useful historical role."

