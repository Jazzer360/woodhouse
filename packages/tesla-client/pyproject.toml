[project]
name = "tpp-tesla-client"
version = "0.0.0"
description = "Typed Tesla Fleet API client boundary"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=50,<51",
  "httpx2>=2.5,<3",
  "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
admin = ["google-cloud-secret-manager>=2.23,<3"]

[project.scripts]
tesla-register-partner = "tesla_personal_platform.tesla_client.admin:register_partner_main"
prepare-telemetry-trust-profile = "tesla_personal_platform.tesla_client.trust_admin:prepare_trust_profile_main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tesla_personal_platform"]
