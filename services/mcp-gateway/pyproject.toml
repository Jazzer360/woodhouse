[project]
name = "tpp-mcp-gateway"
version = "0.0.0"
description = "Authenticated MCP gateway boundary"
requires-python = ">=3.12,<3.13"
dependencies = [
  "authlib>=1.6,<2",
  "anyio>=4,<5",
  "cryptography>=50,<51",
  "httpx2>=2.5,<3",
  "jinja2>=3.1,<4",
  "mcp>=2,<3",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "starlette>=1.0,<2",
  "tpp-analytics",
  "tpp-auth",
  "tpp-tesla-client",
  "uvicorn>=0.31,<1",
]

[tool.uv.sources]
tpp-analytics = { workspace = true }
tpp-auth = { workspace = true }
tpp-tesla-client = { workspace = true }

[project.scripts]
mcp-gateway = "tesla_personal_platform.mcp_gateway.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tesla_personal_platform"]
