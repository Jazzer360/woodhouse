[project]
name = "tpp-mcp-gateway"
version = "0.0.0"
description = "Authenticated MCP gateway boundary"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=50,<51",
  "tpp-analytics",
  "tpp-auth",
  "tpp-tesla-client",
]

[tool.uv.sources]
tpp-analytics = { workspace = true }
tpp-auth = { workspace = true }
tpp-tesla-client = { workspace = true }

[project.scripts]
mcp-gateway = "tesla_personal_platform.mcp_gateway.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tesla_personal_platform"]
