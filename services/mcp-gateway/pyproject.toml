[project]
name = "tpp-mcp-gateway"
version = "0.0.0"
description = "MCP gateway service scaffold"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
mcp-gateway = "tesla_personal_platform.mcp_gateway.main:main"

[build-system]
