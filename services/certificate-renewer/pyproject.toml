[project]
name = "tpp-certificate-renewer"
version = "0.1.0"
description = "Unattended ACME renewal for the Fleet Telemetry receiver"
requires-python = ">=3.12,<3.13"
dependencies = [
  "certbot==5.7.0",
  "certbot-dns-cloudflare==5.7.0",
  "cryptography==50.0.0",
  "google-auth>=2.38,<3",
  "google-cloud-secret-manager==2.30.0",
]

[project.scripts]
certificate-renewer = "tesla_personal_platform.certificate_renewer.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tesla_personal_platform"]
