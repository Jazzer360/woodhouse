[project]
name = "tpp-telemetry-edge"
version = "0.0.0"
description = "Repository checks for the pinned official Tesla telemetry edge"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
telemetry-edge = "tesla_personal_platform.telemetry_edge.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tesla_personal_platform"]
